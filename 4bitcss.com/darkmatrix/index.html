<style>body {
    max-width: 100vw;
    height: 100vh;
    font-family: 'Roboto', sans-serif;
    margin: 1em;
}

header, footer {
    text-align: center;
}

header > svg {
    display: block;
    text-align: center;
}

@media (orientation: landscape) { .header-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5em } .header-menu-item { text-align: center; padding: 0.5em; } } @media (orientation: portrait) { .header-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 0.25em } .header-menu-item { text-align: center; padding: 0.25em; } }

@media (orientation: landscape) { .footer-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5em } .footer-menu-item { text-align: center; padding: 0.5em; } } @media (orientation: portrait) { .footer-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.25em } .footer-menu-item { text-align: center; padding: 0.25em; } }

.logo { 
    display: inline;
    height: 4.2rem;
}

.expandInline { display: flex; flex-direction: row; }

@media (orientation: landscape) {
    .logo { height: 4.2rem; }
    .site-title, .page-title {
        font-size: 1.23rem;
        line-height: .75rem
    }
}

@media (orientation: portrait) {
    .logo { height: 2.3rem; }
    .site-title, .page-title {
        font-size: 0.84em;
        line-height: .66rem
    }
    .expandInline { display: flex; flex-direction: column; }
}

pre, code { font-family: 'Inconsolata', monospace; }

a, a:visited {
    text-decoration: none;
}

a:hover, a:focus {
    text-decoration: underline;    
}

.main {
    font-size: 1.23em;
}

.taskbar {
    float: right;
    position: absolute;
    top: 0; right: 0; z-index: 10;    
    display: flex; flex-direction: row-reverse;
    align-content: right; align-items: flex-start;
    margin: 1em; gap: 0.5em;
}

.taskbar summary { 
    color: var(--cyan);
    list-style-type: none;
}

.background {
    position: fixed;    
    top: 0; left: 0;
    margin-bottom: 0;
    min-width: 100%; height:100%;
}

.backdrop-svg {
    z-index: -100;
}

.backdrop-canvas {
    z-index: -99;
}</style>

<script>
function SetPalette() {
    var palette = document.getElementById('palette')
    if (! palette) {
        palette = document.createElement('link')
        palette.rel = 'stylesheet'
        palette.id = 'palette'
        document.head.appendChild(palette)
    }
    var selectPalette = document.getElementById('SelectPalette')
    var selectedPalette = selectPalette.value
    palette.href = '/css/' + selectedPalette + '.css'
    
    const paletteChangedEvent = new CustomEvent('paletteChanged', {
        bubbles: true,
        detail: {
            name: selectedPalette,
            href: palette.href
        }
    })
    palette.dispatchEvent(paletteChangedEvent)
    palette.addEventListener('paletteChanged', (e)=>{
        console.log(e.detail)
    })
}
</script>

    for (var paletteIndex = 0; paletteIndex < paletteSelector.options.length; paletteIndex++) {

            paletteSelector.selectedIndex = paletteIndex
            break    
        }
    }    
}
</script>
<script>
function GetRandomPalette() {
    var SelectPalette = document.getElementById('SelectPalette')
    if (SelectPalette) {
        var randomNumber = Math.floor(Math.random() * SelectPalette.length);
        SelectPalette.selectedIndex = randomNumber
        SetPalette()
    }    
}
</script>

<script>
    function UpdatePaletteLinks(paletteName) {
        if (! paletteName) {
            paletteName = getComputedStyle(link).getPropertyValue('--PaletteFileName')
        }

        document.
            querySelectorAll('.paletteLink').
            forEach(
                (link) => {                    
                    link.href = '/' + paletteName
                }
            )
                
        document.
            querySelectorAll('.paletteFileLink').
            forEach(
                (link) => {                    
                    link.href = '/css/' + paletteName + '.css'
                }
            )        
    }

    var paletteStylesheetLink = document.getElementById('palette')
    
    if (paletteStylesheetLink) {
        paletteStylesheetLink.addEventListener('paletteChanged', (event)=>{
            UpdatePaletteLinks(event.detail.name) 
        })
        var paletteName = getComputedStyle(paletteStylesheetLink).getPropertyValue('--PaletteFileName')
        UpdatePaletteLinks(paletteName)
    }
